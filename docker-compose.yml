# NOTE: not yet run by the author (no Docker access on the development machine); the image it builds does build in CI.
# Usage:  cp .env.example .env  (set POSTGRES_PASSWORD)  ->  docker compose up -d --build
# First user:  docker compose run --rm app python -m tessera.recon.admin create-user alice --role admin
# Put a TLS-terminating reverse proxy in front before exposing this beyond localhost, and set MATCHBOOK_COOKIE_SECURE=true.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: matchbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: matchbook
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchbook -d matchbook"]
      interval: 5s
      timeout: 3s
      retries: 10
    # no published ports: only the app can reach the database
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      MATCHBOOK_DATABASE_URL: postgresql://matchbook:${POSTGRES_PASSWORD}@db:5432/matchbook
      MATCHBOOK_REQUIRE_CHECKER: ${MATCHBOOK_REQUIRE_CHECKER:-true}
      MATCHBOOK_COOKIE_SECURE: ${MATCHBOOK_COOKIE_SECURE:-false}
      MATCHBOOK_ALLOWED_HOSTS: ${MATCHBOOK_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MATCHBOOK_SESSION_HOURS: ${MATCHBOOK_SESSION_HOURS:-8}
      MATCHBOOK_IDLE_MINUTES: ${MATCHBOOK_IDLE_MINUTES:-60}
      MATCHBOOK_ENABLE_DEMO: ${MATCHBOOK_ENABLE_DEMO:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    ports: ["127.0.0.1:8788:8788"]          # localhost only on the host; expose via a reverse proxy with TLS
    volumes: [appdata:/app/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  ollama:                                    # optional local model server: docker compose --profile ai up -d
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
volumes:
  pgdata:
  appdata:
  ollama:
