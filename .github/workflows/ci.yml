# NOTE: written but not executed on GitHub from the machine where it was authored. The same steps were run locally where possible.
name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install "ruff>=0.6"
      - run: ruff check .            # includes the security (S) rules; the SQL-string exemptions are scoped in pyproject.toml
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: matchbook_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MATCHBOOK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/matchbook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q --maxfail=5      # no local model needed: tests stub the LLM
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install pip-audit .
      # audit third-party packages only: the project itself is not on PyPI, so auditing it would always fail
      - run: pip freeze | grep -vi '^tessera' > reqs.txt && pip-audit -r reqs.txt --no-deps --disable-pip
  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: matchbook:ci, cache-from: type=gha, cache-to: "type=gha,mode=max"}
